name: inou_app
description: InoU AI-powered photo question bank, wrong-question notebook, and adaptive tutor app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.29.0"

resolution: workspace

dependencies:
  archive: ^3.6.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  inou_ai: ^0.1.0
  inou_domain: ^0.1.0
  inou_ink: ^0.1.0
  inou_ui_kit: ^0.1.0
  material_ui: ^1.1.0
  path: ^1.9.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/knowledge/
    - assets/prompts/
    - assets/mascot/default/
